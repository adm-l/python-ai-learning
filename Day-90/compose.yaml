services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ORDER_API_DB: /data/orders.db
    volumes:
      - order_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  order_data:
